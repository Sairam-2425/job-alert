name: AI Job Alert

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (score jobs, no email, no history changes)"
        type: boolean
        default: false

# Never let two runs overlap (they would race on data/seen_jobs.json).
concurrency:
  group: ai-job-alert
  cancel-in-progress: false

# Least privilege: the only write needed is committing data/*.json back to the repo.
permissions:
  contents: write

jobs:
  job-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run job alert (retries transient failures)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}   # optional - leave the secret unset to run with no AI
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}          # optional repository variable (model name override)
          DRY_RUN: ${{ inputs.dry_run }}
          # ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}   # optional sources - see README
          # ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          set +e
          for attempt in 1 2; do
            python -m src.main
            code=$?
            # 0 = success, 3 = configuration error (retrying cannot help)
            if [ "$code" -eq 0 ] || [ "$code" -eq 3 ]; then exit "$code"; fi
            echo "Attempt $attempt exited with code $code"
            if [ "$attempt" -lt 2 ]; then sleep 90; fi
          done
          exit "$code"

      # Runs even when the previous step failed, so partial progress (e.g. jobs already scored,
      # or notified before a later error) is never lost.
      - name: Persist job history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json data/candidate_profile.json
          if git diff --cached --quiet; then
            echo "No history changes to commit"
          else
            git commit -m "chore: update job history [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && git push && break
              sleep 5
            done
          fi

      - name: Upload dry-run preview
        if: always() && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: digest-preview
          path: out/digest_preview.html
          if-no-files-found: ignore
